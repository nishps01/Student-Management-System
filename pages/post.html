<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Form</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <div class="container">


        <!-- Top Navigation -->

        <div class="top-nav">

            <h3>Student Management</h3>

            <div class="nav-links">

                <a href="/home.html">Home</a>

                <a href="/post.html">Add Student</a>

                <a href="/allstudents.html">All Data</a>

                <a href="/manage.html">Manage Data</a>

            </div>

        </div>


        <!-- Student Form -->

        <h2>Student Details</h2>

        <form method="POST" action="/data">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter name"
                required
            >


            <label>Section</label>

            <input
                type="text"
                name="section"
                placeholder="Enter section"
                required
            >


            <div class="row">

                <div>

                    <label>High School</label>

                    <input
                        type="text"
                        name="highschool"
                        inputmode="numeric"
                        maxlength="3"
                        pattern="[0-9]{1,3}"
                        placeholder="High School"
                        required
                    >

                </div>


                <div>

                    <label>Intermediate</label>

                    <input
                        type="text"
                        name="intermediate"
                        inputmode="numeric"
                        maxlength="3"
                        pattern="[0-9]{1,3}"
                        placeholder="Intermediate"
                        required
                    >

                </div>

            </div>


            <div class="row">

                <div>

                    <label>BCA</label>

                    <input
                        type="text"
                        name="bca"
                        inputmode="numeric"
                        maxlength="3"
                        pattern="[0-9]{1,3}"
                        placeholder="BCA"
                        required
                    >

                </div>


                <div>

                    <label>MCA</label>

                    <input
                        type="text"
                        name="mca"
                        inputmode="numeric"
                        maxlength="3"
                        pattern="[0-9]{1,3}"
                        placeholder="MCA"
                        required
                    >

                </div>

            </div>


            <button type="submit">
                Submit
            </button>

        </form>


    </div>

</body>

</html>
